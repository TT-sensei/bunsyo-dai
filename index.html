<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算数クエスト - 冒険の拠点</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@400;700;900&display=swap');

        :root {
            --bg: #e8f4fd;
            --bg2: #d0eaf8;
            --card: #ffffff;
            --gold: #e68a00;
            --gold2: #c97700;
            --green: #2e9e5b;
            --blue: #1976d2;
            --purple: #7c3aed;
            --red: #e53935;
            --text: #1a2a3a;
            --text2: #5a7080;
            --border: rgba(30,100,180,0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(160deg, #cce8ff 0%, #e0f5e9 50%, #fff9e0 100%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* 雲・空っぽい背景装飾 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 120px 60px at 10% 8%, rgba(255,255,255,0.7) 0%, transparent 100%),
                radial-gradient(ellipse 80px 40px at 40% 5%, rgba(255,255,255,0.6) 0%, transparent 100%),
                radial-gradient(ellipse 100px 50px at 75% 10%, rgba(255,255,255,0.65) 0%, transparent 100%),
                radial-gradient(ellipse 60px 30px at 90% 6%, rgba(255,255,255,0.5) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ヘッダー */
        .app-header {
            position: relative;
            z-index: 1;
            background: linear-gradient(135deg, #1565c0 0%, #0288d1 60%, #26c6da 100%);
            border-bottom: 3px solid rgba(255,255,255,0.3);
            padding: 18px 20px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(21,101,192,0.3);
        }

        .app-title {
            font-family: 'Kaisei Decol', serif;
            font-size: 1.9rem;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2), 0 0 20px rgba(255,220,100,0.4);
            letter-spacing: 0.05em;
        }

        /* ステータス */
        .status-card {
            position: relative;
            z-index: 1;
            background: #ffffff;
            border: 2px solid rgba(21,101,192,0.15);
            border-radius: 16px;
            margin: 16px 12px;
            padding: 16px 20px;
            box-shadow: 0 4px 16px rgba(21,101,192,0.1);
        }

        .status-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .level-badge {
            background: linear-gradient(135deg, var(--gold), var(--gold2));
            color: #1a0f2e;
            font-weight: 900;
            font-size: 1.1rem;
            padding: 4px 14px;
            border-radius: 20px;
        }

        .title-badge {
            color: #7c3aed;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .solved-count {
            color: var(--text2);
            font-size: 0.85rem;
        }

        .solved-count span {
            color: var(--gold);
            font-weight: 700;
            font-size: 1rem;
        }

        /* EXPバー */
        .exp-bar-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .exp-label {
            font-size: 0.8rem;
            color: var(--text2);
            white-space: nowrap;
        }

        .exp-bar-bg {
            flex: 1;
            height: 14px;
            background: rgba(255,255,255,0.08);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--green), #7fff7f);
            border-radius: 7px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .exp-text {
            font-size: 0.8rem;
            color: var(--green);
            font-weight: 700;
            white-space: nowrap;
        }

        /* アイテム入手通知 */
        .item-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 100;
            background: #ffffff;
            border: 3px solid #f5a623;
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(230,138,0,0.25);
            animation: none;
        }

        .item-popup.show {
            display: block;
            animation: popupIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .item-popup.rare { border-color: #1976d2; box-shadow: 0 8px 40px rgba(25,118,210,0.3); }
        .item-popup.superrare { border-color: #f5a623; box-shadow: 0 8px 60px rgba(245,166,35,0.5); }

        @keyframes popupIn {
            from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .popup-emoji { font-size: 4rem; margin-bottom: 10px; }
        .popup-rarity { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 6px; }
        .popup-rarity.common { color: var(--green); }
        .popup-rarity.rare { color: var(--blue); }
        .popup-rarity.superrare { color: var(--gold); }
        .popup-name { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 20px; }

        .popup-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 99;
        }
        .popup-overlay.show { display: block; }

        .btn-popup-close {
            background: linear-gradient(135deg, #f5a623, #e68a00);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Noto Sans JP', sans-serif;
            box-shadow: 0 3px 8px rgba(230,138,0,0.4);
        }

        /* メインコンテンツ */
        #main-content {
            position: relative;
            z-index: 1;
            max-width: 640px;
            margin: 0 auto;
            padding: 0 12px;
        }

        /* セクションタイトル */
        .section-title {
            font-family: 'Kaisei Decol', serif;
            font-size: 1.1rem;
            color: #1565c0;
            margin: 24px 0 12px 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, rgba(21,101,192,0.3), transparent);
        }

        /* 学年選択 */
        .grade-card {
            background: #ffffff;
            border: 2px solid rgba(21,101,192,0.15);
            border-radius: 16px;
            margin-bottom: 10px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(21,101,192,0.1);
            transition: border-color 0.2s;
        }

        .grade-card.open { border-color: #1976d2; }

        .grade-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .grade-header:hover { background: rgba(167,139,250,0.05); }

        .grade-label {
            font-size: 1.1rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grade-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .grade-1 .grade-icon { background: rgba(76,175,125,0.2); }
        .grade-2 .grade-icon { background: rgba(91,156,246,0.2); }
        .grade-3 .grade-icon { background: rgba(167,139,250,0.2); }

        .grade-chevron {
            color: var(--text2);
            font-size: 1.2rem;
            transition: transform 0.3s;
        }

        .grade-card.open .grade-chevron { transform: rotate(180deg); }

        /* サブメニュー */
        .sub-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s ease;
            border-top: 0px solid var(--border);
        }

        .grade-card.open .sub-menu {
            max-height: 500px;
            border-top: 1px solid var(--border);
        }

        .sub-menu-inner { padding: 16px; }

        .sub-section-label {
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--text2);
            margin: 14px 0 8px 2px;
        }

        .sub-section-label:first-child { margin-top: 0; }

        .quest-btn {
            display: block;
            width: 100%;
            padding: 13px 18px;
            margin-bottom: 8px;
            border: none;
            border-radius: 12px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.1s, opacity 0.1s;
        }

        .quest-btn:active { transform: scale(0.97); opacity: 0.8; }

        .btn-story {
            background: linear-gradient(135deg, #1565c0, #0288d1);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .btn-cave {
            background: #f5f5f5;
            color: var(--text2);
            border: 1px dashed #b0bec5;
        }

        .btn-train {
            background: #e3f2fd;
            color: var(--blue);
            border: 1px solid rgba(25,118,210,0.3);
            border-radius: 12px;
            padding: 12px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            text-align: center;
            transition: transform 0.1s, background 0.15s;
        }

        .btn-train:active { transform: scale(0.97); }
        .btn-train:hover { background: #bbdefb; }

        .btn-train-wide {
            grid-column: span 2;
            background: #ede7f6;
            color: var(--purple);
            border: 1px solid rgba(124,58,237,0.3);
        }

        .btn-train-wide:hover { background: #d1c4e9; }

        /* 図鑑 */
        .zukan-card {
            background: #ffffff;
            border: 2px solid rgba(21,101,192,0.15);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 10px rgba(21,101,192,0.1);
            margin-bottom: 10px;
        }

        .zukan-item {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: #f0f7ff;
            border: 1px solid rgba(21,101,192,0.12);
            transition: transform 0.15s;
            position: relative;
        }

        .zukan-item.got { background: #e8f5e9; border-color: rgba(46,158,91,0.35); }
        .zukan-item.got:hover { transform: scale(1.15); }
        .zukan-item.got.rare { border-color: rgba(25,118,210,0.5); background: #e3f2fd; }
        .zukan-item.got.superrare { border-color: rgba(230,138,0,0.6); background: #fff8e1; }
        .zukan-item.unknown { color: #c8d8e8; font-size: 1rem; }

        /* 図鑑スライダー（5枚ページ式） */
        .zukan-slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .zukan-arrow {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(21,101,192,0.2);
            background: #f0f7ff;
            color: #1565c0;
            font-size: 1.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, transform 0.1s;
            padding: 0;
            line-height: 1;
        }

        .zukan-arrow:hover { background: #dbeafe; }
        .zukan-arrow:active { transform: scale(0.88); }
        .zukan-arrow:disabled { opacity: 0.25; cursor: default; }

        .zukan-slider-viewport {
            flex: 1;
            overflow: hidden;
            border-radius: 10px;
        }

        .zukan-slider-track {
            display: flex;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 1ページ = 5枚グリッド */
        .zukan-page {
            flex-shrink: 0;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            padding: 4px 0;
        }

        /* 各カード */
        .zukan-card-item {
            aspect-ratio: 3/4;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: 2px solid rgba(21,101,192,0.12);
            background: #f0f7ff;
            transition: transform 0.15s;
        }

        .zukan-card-item.got { background: #e8f5e9; border-color: rgba(46,158,91,0.35); }
        .zukan-card-item.got:hover { transform: scale(1.06); }
        .zukan-card-item.got.rare { background: #e3f2fd; border-color: rgba(25,118,210,0.45); }
        .zukan-card-item.got.superrare {
            background: #fff8e1;
            border-color: rgba(230,138,0,0.55);
            box-shadow: 0 2px 8px rgba(230,138,0,0.15);
        }

        .zukan-card-emoji { font-size: 1.7rem; line-height: 1; }

        .zukan-card-name {
            font-size: 0.56rem;
            font-weight: 700;
            color: #5a7080;
            text-align: center;
            line-height: 1.2;
            padding: 0 2px;
        }

        .zukan-card-rarity {
            font-size: 0.5rem;
            font-weight: 700;
        }
        .zukan-card-rarity.rare      { color: #1976d2; }
        .zukan-card-rarity.superrare { color: #e68a00; }

        /* 空きカード（？） */
        .zukan-card-item.unknown {
            background: #f8fafc;
            border: 2px dashed rgba(21,101,192,0.1);
        }
        .zukan-card-item.unknown .zukan-card-emoji {
            font-size: 1.2rem;
            color: #c8d8e8;
        }

        /* ページラベル */
        .zukan-page-label {
            text-align: center;
            font-size: 0.78rem;
            color: var(--text2);
            margin-bottom: 8px;
        }

        /* ドット */
        .zukan-dots {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 6px;
        }

        .zukan-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(21,101,192,0.15);
            transition: background 0.2s, transform 0.2s;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .zukan-dot.active { background: #1976d2; transform: scale(1.35); }

        /* 次のアイテムまで */
        .next-item-hint {
            margin-top: 14px;
            padding: 10px 14px;
            background: #f0f7ff;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .next-item-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
            overflow: hidden;
        }

        .next-item-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #1976d2, #26c6da);
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        /* リセット */
        .btn-reset {
            display: block;
            margin: 30px auto 0;
            background: none;
            border: 1px solid #cfd8dc;
            color: #90a4ae;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.8rem;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .hidden { display: none !important; }

        /* フラッシュ演出 */
        .flash-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 98;
            opacity: 0;
            transition: opacity 0.1s;
        }

        .flash-overlay.flash-green { background: rgba(76,175,125,0.15); }
        .flash-overlay.flash-blue { background: rgba(91,156,246,0.2); }
        .flash-overlay.flash-gold { background: rgba(245,200,66,0.25); }
    </style>
</head>
<body>

<div class="flash-overlay" id="flash-overlay"></div>
<div class="popup-overlay" id="popup-overlay" onclick="closePopup()"></div>

<!-- アイテムポップアップ -->
<div class="item-popup" id="item-popup">
    <div class="popup-rarity" id="popup-rarity-text">コモン</div>
    <div class="popup-emoji" id="popup-emoji">🐸</div>
    <div class="popup-name" id="popup-name">カエル</div>
    <button class="btn-popup-close" onclick="closePopup()">やったー！</button>
</div>

<!-- ヘッダー -->
<header class="app-header">
    <div class="app-title">⚔️ 算数クエスト</div>
</header>

<!-- ステータス -->
<div class="status-card">
    <div class="status-top">
        <div>
            <div class="level-badge">Lv. <span id="disp-level">1</span></div>
        </div>
        <div class="title-badge" id="disp-title">みならいの拾い屋</div>
        <div class="solved-count">といた: <span id="disp-solved">0</span>もん</div>
    </div>
    <div class="exp-bar-wrap">
        <div class="exp-label">EXP</div>
        <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="exp-bar" style="width:0%"></div>
        </div>
        <div class="exp-text" id="exp-text">0/5</div>
    </div>
</div>

<main id="main-content">

    <!-- 学年選択 -->
    <div class="section-title">🗺️ ぼうけんにでかける</div>

    <!-- 1年生 -->
    <div class="grade-card grade-1" id="card-grade1">
        <div class="grade-header" onclick="toggleGrade('card-grade1')">
            <div class="grade-label">
                <div class="grade-icon">🌱</div>
                1ねんせい（たしざん・ひきざん）
            </div>
            <div class="grade-chevron">▼</div>
        </div>
        <div class="sub-menu">
            <div class="sub-menu-inner">
                <div class="sub-section-label">⚔️ ストーリークエスト</div>
                <button class="quest-btn btn-story" onclick="goToQuest('quest.html?grade=1&mode=story')">
                    ⚔️ ぼうけんにでかける（きほん）
                </button>
                <div class="sub-section-label">🎯 とっくん（にがてをせめる）</div>
                <div class="train-grid">
                    <button class="btn-train" onclick="goToQuest('quest.html?grade=1&mode=train_add')">＋ たしざん</button>
                    <button class="btn-train" onclick="goToQuest('quest.html?grade=1&mode=train_sub')">－ ひきざん</button>
                </div>
                <div class="sub-section-label">🕳 まちがいなおし</div>
                <button class="quest-btn btn-cave" onclick="goToQuest('quest.html?grade=1&mode=cave')">
                    🕳 まちがえた もんだいをやりなおす
                </button>
            </div>
        </div>
    </div>

    <!-- 2年生 -->
    <div class="grade-card grade-2" id="card-grade2">
        <div class="grade-header" onclick="toggleGrade('card-grade2')">
            <div class="grade-label">
                <div class="grade-icon">🌿</div>
                2ねんせい（＋かけざん）
            </div>
            <div class="grade-chevron">▼</div>
        </div>
        <div class="sub-menu">
            <div class="sub-menu-inner">
                <div class="sub-section-label">⚔️ ストーリークエスト</div>
                <button class="quest-btn btn-story" onclick="goToQuest('quest.html?grade=2&mode=story')">
                    ⚔️ ぼうけんにでかける（きほん）
                </button>
                <div class="sub-section-label">🎯 とっくん（にがてをせめる）</div>
                <div class="train-grid">
                    <button class="btn-train" onclick="goToQuest('quest.html?grade=2&mode=train_add')">＋ たしざん</button>
                    <button class="btn-train" onclick="goToQuest('quest.html?grade=2&mode=train_sub')">－ ひきざん</button>
                    <button class="btn-train btn-train-wide" onclick="goToQuest('quest.html?grade=2&mode=train_mul')">× かけざん</button>
                </div>
                <div class="sub-section-label">🕳 まちがいなおし</div>
                <button class="quest-btn btn-cave" onclick="goToQuest('quest.html?grade=2&mode=cave')">
                    🕳 まちがえた もんだいをやりなおす
                </button>
            </div>
        </div>
    </div>

    <!-- 3年生 -->
    <div class="grade-card grade-3" id="card-grade3">
        <div class="grade-header" onclick="toggleGrade('card-grade3')">
            <div class="grade-label">
                <div class="grade-icon">🌳</div>
                3ねんせい（＋わりざん）
            </div>
            <div class="grade-chevron">▼</div>
        </div>
        <div class="sub-menu">
            <div class="sub-menu-inner">
                <div class="sub-section-label">⚔️ ストーリークエスト</div>
                <button class="quest-btn btn-story" onclick="goToQuest('quest.html?grade=3&mode=story')">
                    ⚔️ ぼうけんにでかける（きほん）
                </button>
                <div class="sub-section-label">🎯 とっくん（にがてをせめる）</div>
                <div class="train-grid">

// サウンド

let audioCtx = null;
function getAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
}

function playSound(type) {
    try {
        const ctx = getAudio();
        if (ctx.state === 'suspended') ctx.resume();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(700, ctx.currentTime);
            gain.gain.setValueAtTime(0.08, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'item_common') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(660, ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'item_rare') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(1047, ctx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
            osc.start(); osc.stop(ctx.currentTime + 0.6);
        } else if (type === 'item_superrare') {
            // 和音っぽく2音
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.connect(gain2); gain2.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(1047, ctx.currentTime + 0.8);
            gain.gain.setValueAtTime(0.12, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
            osc2.type = 'sine';
            osc2.frequency.setValueAtTime(659, ctx.currentTime);
            osc2.frequency.linearRampToValueAtTime(1318, ctx.currentTime + 0.8);
            gain2.gain.setValueAtTime(0.1, ctx.currentTime);
            gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
            osc.start(); osc.stop(ctx.currentTime + 0.9);
            osc2.start(); osc2.stop(ctx.currentTime + 0.9);
            return;
        }
    } catch(e) {}
}

// ========================================
// セーブデータ読み込み
// ========================================
function load(key, def) {
    const v = localStorage.getItem(key);
    return v !== null ? JSON.parse(v) : def;
}
function save(key, val) {
    localStorage.setItem(key, JSON.stringify(val));
}

if (!itemOrder) {
    itemOrder = shuffleArray(allItems.map(i => i.id));
    save('saved_item_order', itemOrder);
}
// 次に配布するアイテムのインデックス
let nextItemIndex = load('saved_next_item_index', 0);

// ========================================
// シャッフル
// ========================================
function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ========================================
// 称号取得
// ========================================
function getTitle(lv) {
    const capped = Math.min(lv, 100);
    let t = titles[0].name;
    for (let i = 0; i < titles.length; i++) {
        if (capped >= titles[i].lv) t = titles[i].name;
    }
    return t;
}

    const pct = (exp / 5) * 100;
    document.getElementById('exp-bar').style.width = pct + '%';
    document.getElementById('exp-text').innerText = exp + '/5';

    // 次のアイテムまで
    const levelsToNext = 5 - (level % 5 === 0 ? 5 : level % 5);
    const nextItemLevel = level + levelsToNext;
    const progressInCycle = (level % 5 === 0) ? 5 : (level % 5);
    const pctNext = (progressInCycle / 5) * 100;
    document.getElementById('next-item-bar').style.width = pctNext + '%';
    document.getElementById('next-item-text').innerText = `Lv.${nextItemLevel}で！`;

    save('saved_level', level);
    save('saved_exp', exp);
    save('saved_solved_count', solvedCount);
    save('saved_collection', collectedIds);
    save('saved_next_item_index', nextItemIndex);
}

// ========================================
// 図鑑スライダー（5枚ページ式）
// ========================================
const ITEMS_PER_PAGE = 5;
let zukanPage = 0;

function buildZukanSlider() {
    const track  = document.getElementById('zukan-track');
    const dotsEl = document.getElementById('zukan-dots');
    track.innerHTML  = '';
    dotsEl.innerHTML = '';

    // 入手済みアイテムを入手順に並べる
    const gotItems = collectedIds
        .map(id => allItems.find(i => i.id === id))
        .filter(Boolean);

    document.getElementById('zukan-count').innerText = gotItems.length;

    // ページ数（最低1ページは用意）
    const totalPages = Math.max(1, Math.ceil(gotItems.length / ITEMS_PER_PAGE));
    if (zukanPage >= totalPages) zukanPage = totalPages - 1;

    for (let p = 0; p < totalPages; p++) {
        const page = document.createElement('div');
        page.className = 'zukan-page';

        for (let i = 0; i < ITEMS_PER_PAGE; i++) {
            const item = gotItems[p * ITEMS_PER_PAGE + i];
            const card = document.createElement('div');

            if (item) {
                // 入手済みカード
                card.className = `zukan-card-item got ${item.rarity}`;
                const rarityText = item.rarity === 'superrare' ? 'SR'
                                 : item.rarity === 'rare'      ? 'R' : '';
                card.innerHTML = `
                    <div class="zukan-card-emoji">${item.emoji}</div>
                    <div class="zukan-card-name">${item.name}</div>
                    ${rarityText ? `<div class="zukan-card-rarity ${item.rarity}">${rarityText}</div>` : ''}
                `;
            } else {
                // 空きスペース → ？マーク
                card.className = 'zukan-card-item unknown';
                card.innerHTML = `<div class="zukan-card-emoji">？</div>`;
            }
            page.appendChild(card);
        }
        track.appendChild(page);

        // ドット
        const dot = document.createElement('button');
        dot.className = 'zukan-dot' + (p === zukanPage ? ' active' : '');
        dot.setAttribute('aria-label', `${p + 1}ページ`);
        dot.onclick = () => goToZukanPage(p);
        dotsEl.appendChild(dot);
    }

    applyZukanSlide(totalPages);
}

function applyZukanSlide(totalPages) {
    const tp = totalPages ?? Math.max(1, Math.ceil(collectedIds.length / ITEMS_PER_PAGE));
    document.getElementById('zukan-track').style.transform = `translateX(-${zukanPage * 100}%)`;

    document.querySelectorAll('.zukan-dot').forEach((d, i) => {
        d.classList.toggle('active', i === zukanPage);
    });

    document.getElementById('zukan-page-label').innerText = `${zukanPage + 1} / ${tp}`;
    document.querySelector('.zukan-arrow-left').disabled  = zukanPage === 0;
    document.querySelector('.zukan-arrow-right').disabled = zukanPage >= tp - 1;
}

function slideZukan(dir) {
    const tp = Math.max(1, Math.ceil(collectedIds.length / ITEMS_PER_PAGE));
    const next = zukanPage + dir;
    if (next < 0 || next >= tp) return;
    zukanPage = next;
    applyZukanSlide(tp);
}

function goToZukanPage(p) {
    zukanPage = p;
    applyZukanSlide(Math.max(1, Math.ceil(collectedIds.length / ITEMS_PER_PAGE)));
}

    if (vp && vp.contains(e.target)) touchStartX = e.touches[0].clientX;
}, { passive: true });

document.addEventListener('touchend', e => {
    const vp = document.getElementById('zukan-viewport');
    if (vp && vp.contains(e.target)) {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (Math.abs(diff) > 40) slideZukan(diff > 0 ? 1 : -1);
    }
}, { passive: true });

function updateZukan() {
    buildZukanSlider();
}

// ========================================
// アイテム付与（レベルアップ時）
// ========================================
function giveItem() {
    if (nextItemIndex >= allItems.length) return; // 50個コンプ済み
    const itemId = itemOrder[nextItemIndex];
    nextItemIndex++;
    const item = allItems.find(i => i.id === itemId);
    if (!item) return;
    if (!collectedIds.includes(item.id)) {
        collectedIds.push(item.id);
    }
    showItemPopup(item);
}

// ========================================
// フラッシュ演出
// ========================================
function flashBg(type) {
    const el = document.getElementById('flash-overlay');
    el.className = 'flash-overlay flash-' + type;
    el.style.opacity = '1';
    setTimeout(() => { el.style.opacity = '0'; }, 300);
}

// ========================================
// アイテムポップアップ
// ========================================
function showItemPopup(item) {
    const popup = document.getElementById('item-popup');
    const overlay = document.getElementById('popup-overlay');

    document.getElementById('popup-emoji').innerText = item.emoji;
    document.getElementById('popup-name').innerText = item.name;

    const rarityEl = document.getElementById('popup-rarity-text');
    if (item.rarity === 'superrare') {
        rarityEl.innerText = '✨ スーパーレア ✨';
        rarityEl.className = 'popup-rarity superrare';
        popup.className = 'item-popup superrare';
        flashBg('gold');
        playSound('item_superrare');
    } else if (item.rarity === 'rare') {
        rarityEl.innerText = '💙 レア';
        rarityEl.className = 'popup-rarity rare';
        popup.className = 'item-popup rare';
        flashBg('blue');
        playSound('item_rare');
    } else {
        rarityEl.innerText = '💚 ゲット！';
        rarityEl.className = 'popup-rarity common';
        popup.className = 'item-popup';
        flashBg('green');
        playSound('item_common');
    }

    overlay.classList.add('show');
    popup.classList.remove('show');
    void popup.offsetWidth; // reflow
    popup.classList.add('show');

    updateZukan();
}

function closePopup() {
    document.getElementById('item-popup').classList.remove('show');
    document.getElementById('popup-overlay').classList.remove('show');
}

// ========================================
// レベルアップ（quest.htmlからも呼べるようlocalStorage経由）
// ========================================
// ※ quest.html側でsaved_exp等を更新した後、index.htmlに戻ったときに反映される

// ========================================
// メニュー操作
// ========================================
function toggleGrade(cardId) {
    playSound('click');
    document.querySelectorAll('.grade-card').forEach(c => {
        if (c.id !== cardId) c.classList.remove('open');
    });
    document.getElementById(cardId).classList.toggle('open');
}

function goToQuest(url) {
    playSound('click');
    setTimeout(() => { window.location.href = url; }, 120);
}

// ========================================
// リセット
// ========================================
function resetData() {
    if (confirm('ほんとうに ぜんぶの きろくを けしますか？\nあつめた ずかんも ゼロになります。')) {
        localStorage.clear();
        alert('データを リセットしました！ あらたな ぼうけんの はじまりです！');
        location.reload();
    }
}

// ========================================
// ページに戻ってきたとき（quest.htmlからの帰還）
// ========================================
function checkLevelUp() {
    // quest.html側でレベルアップ処理をして、index.htmlに戻ったときにアイテムを配布
    const pendingItems = load('saved_pending_items', 0);
    if (pendingItems > 0) {
        save('saved_pending_items', 0);
        for (let i = 0; i < pendingItems; i++) {
            setTimeout(() => giveItem(), i * 800);
        }
    }
}

// ========================================
// 初期化
// ========================================
window.onload = function() {
    // 最新データ再読み込み
    level       = load('saved_level', 1);
    exp         = load('saved_exp', 0);
    solvedCount = load('saved_solved_count', 0);
    collectedIds= load('saved_collection', []);
    itemOrder   = load('saved_item_order', null);
    if (!itemOrder) {
        itemOrder = shuffleArray(allItems.map(i => i.id));
        save('saved_item_order', itemOrder);
    }
    nextItemIndex = load('saved_next_item_index', 0);

    updateStatus();
    updateZukan();
    checkLevelUp();
};
</script>
